<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4ade80"/>
      <stop offset="100%" stop-color="#16a34a"/>
    </linearGradient>
    <linearGradient id="chartGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.9"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Card -->
  <rect width="512" height="512" rx="96" fill="url(#bgGrad)" stroke="#1e293b" stroke-width="4"/>

  <!-- Subtle Matrix Circuit Grid -->
  <g opacity="0.12" stroke="#38bdf8" stroke-width="1.5">
    <path d="M 64 128 L 448 128 M 64 256 L 448 256 M 64 384 L 448 384"/>
    <path d="M 128 64 L 128 448 M 256 64 L 256 448 M 384 64 L 384 448"/>
    <circle cx="128" cy="128" r="4" fill="#38bdf8"/>
    <circle cx="384" cy="128" r="4" fill="#38bdf8"/>
    <circle cx="128" cy="384" r="4" fill="#38bdf8"/>
    <circle cx="384" cy="384" r="4" fill="#38bdf8"/>
  </g>

  <!-- Central Regulatory Shield with Glow -->
  <path d="M 256 76
           C 340 76, 396 96, 396 160
           C 396 280, 296 356, 256 388
           C 216 356, 116 280, 116 160
           C 116 96, 172 76, 256 76 Z"
        fill="#0f172a"
        stroke="url(#shieldGrad)"
        stroke-width="8"
        stroke-linejoin="round"
        filter="url(#glow)"/>

  <!-- Quant Analytics Bars inside Shield -->
  <g transform="translate(180, 170)">
    <!-- Bar 1 -->
    <rect x="0" y="80" width="24" height="60" rx="6" fill="#38bdf8" opacity="0.7"/>
    <!-- Bar 2 -->
    <rect x="36" y="44" width="24" height="96" rx="6" fill="#38bdf8" opacity="0.85"/>
    <!-- Bar 3 -->
    <rect x="72" y="16" width="24" height="124" rx="6" fill="url(#accentGrad)"/>
    <!-- Bar 4 -->
    <rect x="108" y="56" width="24" height="84" rx="6" fill="#38bdf8" opacity="0.75"/>
    <!-- Trend Line -->
    <path d="M 12 76 L 48 40 L 84 12 L 120 52"
          fill="none"
          stroke="#4ade80"
          stroke-width="5"
          stroke-linecap="round"
          stroke-linejoin="round"/>
    <circle cx="84" cy="12" r="6" fill="#ffffff" stroke="#16a34a" stroke-width="3"/>
  </g>

  <!-- Sovereign Node Checkmark / Balance Node -->
  <circle cx="256" cy="124" r="14" fill="#38bdf8" opacity="0.2"/>
  <circle cx="256" cy="124" r="8" fill="#38bdf8"/>
  <path d="M 256 134 L 256 165" stroke="#38bdf8" stroke-width="4" stroke-dasharray="3,3"/>

  <!-- Typography: B2B QUANT & REGULATORY COMPLIANCE APIS -->
  <g text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
    <text x="256" y="432" font-size="28" font-weight="900" fill="#f8fafc" letter-spacing="4">B2B QUANT</text>
    <text x="256" y="462" font-size="14" font-weight="700" fill="#38bdf8" letter-spacing="3">REGULATORY COMPLIANCE SUITE</text>
  </g>
</svg>
